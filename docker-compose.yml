networks:
  tg-group-statistics-net:
    driver: bridge
    attachable: true

volumes:
  postgres-data:

services:
  backend:
    image: ghcr.io/nrf24l01/tg_group_statistics/backend:latest
    build:
      context: backend/
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/ping"]
      interval: 5s
      retries: 30
      timeout: 3s
      start_period: 3s
    restart: "no"
    ports:
      - "${NGINX_BIND_IP}:2330:8000"
    env_file:
      - .env
    environment:
      - APP_HOST=:8000
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_SSLMODE=disable
      - POSTGRES_TIMEZONE=Europe/Moscow
      - PRODUCTION_ENV=true
      - NO_LOGS=true
    depends_on:
      postgres:
        condition: service_healthy
      analyzer:
        condition: service_started
    networks:
      - tg-group-statistics-net

  postgres:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - tg-group-statistics-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5
    command: ["postgres", "-c", "listen_addresses=*"]

  analyzer:
    image: ghcr.io/nrf24l01/tg_group_statistics/analyzer:latest
    build:
      context: analyzer/
      dockerfile: Dockerfile
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_SSLMODE=disable
      - POSTGRES_TIMEZONE=Europe/Moscow
      - PRODUCTION_ENV=true
    networks:
      - tg-group-statistics-net
    depends_on:
      postgres:
        condition: service_healthy
  
  parser:
    image: ghcr.io/nrf24l01/tg_group_statistics/parser:latest
    build:
      context: parser/
      dockerfile: Dockerfile
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    networks:
      - tg-group-statistics-net
    env_file:
      - .env
    volumes:
      - ./parser/session.session:/app/session.session
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy